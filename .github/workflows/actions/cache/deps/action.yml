name: Dependency Cache

runs:
  using: "composite"
  steps:
    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          node_modules
        key: node-${{ hashFiles('package-lock.json') }}

    - name: Cache Python deps
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
        key: python-${{ hashFiles('requirements.txt') }}
