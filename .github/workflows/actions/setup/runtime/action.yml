name: Setup Runtime

inputs:
  node_version:
    required: false
    default: "20"
  python_version:
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Verify environment
      shell: bash
      run: |
        node -v
        python --version
